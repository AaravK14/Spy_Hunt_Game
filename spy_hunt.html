<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy Hunt Game - Connected to C++</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.3; }
        }
        .animate-pulse {
            animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes countdown-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .timer-urgent {
            animation: countdown-pulse 0.5s ease-in-out infinite;
            color: #ef4444;
        }
        .timer-warning {
            color: #f59e0b;
        }
        .timer-normal {
            color: #10b981;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white min-h-screen">
    <!-- Background Animation -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 left-10 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-pulse"></div>
        <div class="absolute bottom-20 right-10 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <div class="relative z-10">
        <!-- Header -->
        <header class="bg-black/30 backdrop-blur-md border-b border-purple-500/30 shadow-lg">
            <div class="container mx-auto px-6 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <svg class="w-10 h-10 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
                        </svg>
                        <div>
                            <h1 class="text-3xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
                                Spy Hunt
                            </h1>
                            <p class="text-xs text-green-400">● Connected to C++ Server</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-6">
                        <!-- Timer Display -->
                        <div id="timerDisplay" class="hidden bg-black/50 px-6 py-3 rounded-lg border-2">
                            <div class="text-center">
                                <div class="text-xs font-semibold text-gray-400 mb-1" id="phaseLabel">PHASE</div>
                                <div class="text-3xl font-bold" id="timerValue">00:00</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 bg-purple-500/20 px-4 py-2 rounded-lg">
                            <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
                            </svg>
                            <span class="text-sm font-semibold" id="totalGames">0 Games</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto px-6 py-8">
            <div id="app"></div>
        </main>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        let gameState = {
            screen: 'menu',
            players: [],
            currentPlayer: 0,
            spyIndex: -1,
            hints: {},
            stats: { totalGames: 0, spyWins: 0, playerWins: 0 },
            currentPhase: 'idle',
            wordRevealed: false
        };

        let timerInterval = null;

        // API calls to C++ backend
        async function callAPI(endpoint, params = {}) {
            const queryString = new URLSearchParams(params).toString();
            const url = `${API_URL}/${endpoint}?${queryString}`;
            
            try {
                const response = await fetch(url);
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                alert('Cannot connect to C++ server! Make sure the server is running on port 8080.');
                return { error: error.message };
            }
        }

        async function startGame(numPlayers, theme) {
            const result = await callAPI('start', { players: numPlayers, theme: theme });
            
            if (result.success) {
                gameState.players = Array.from({ length: numPlayers }, (_, i) => ({
                    id: i,
                    name: `Player ${i + 1}`
                }));
                gameState.spyIndex = result.spyIndex;
                gameState.currentPlayer = 0;
                gameState.hints = {};
                gameState.currentPhase = result.phase;
                gameState.wordRevealed = false;
                gameState.screen = 'hints';
                render();
                startTimerPolling();
            }
        }

        async function getPlayerWord(playerIndex) {
            return await callAPI('getWord', { index: playerIndex });
        }

        async function submitHint(playerIndex, hint) {
            const result = await callAPI('submitHint', { index: playerIndex, hint: hint });
            
            if (result.error) {
                alert(result.error);
                return;
            }
            
            if (result.success) {
                gameState.hints[playerIndex] = hint;
                
                if (gameState.currentPlayer < gameState.players.length - 1) {
                    gameState.currentPlayer++;
                    gameState.wordRevealed = false;
                    render();
                } else {
                    // All hints collected, move to discussion
                    await startDiscussionPhase();
                }
            }
        }

        async function startDiscussionPhase() {
            const result = await callAPI('startDiscussionPhase');
            if (result.success) {
                gameState.currentPhase = result.phase;
                gameState.screen = 'discussion';
                render();
            }
        }

        async function startVotingPhase() {
            const result = await callAPI('startVotingPhase');
            if (result.success) {
                gameState.currentPhase = result.phase;
                gameState.screen = 'voting';
                renderVotingScreen();
            }
        }

        async function submitVote(playerIndex) {
            const result = await callAPI('vote', { index: playerIndex });
            
            if (result.error) {
                alert(result.error);
                return;
            }
            
            if (!result.error) {
                gameState.voteResult = result;
                gameState.screen = 'results';
                gameState.currentPhase = 'results';
                stopTimerPolling();
                await updateStats();
                render();
            }
        }

        async function updateStats() {
            const stats = await callAPI('stats');
            gameState.stats = stats;
            document.getElementById('totalGames').textContent = `${stats.totalGames} Games`;
        }

        // Timer Management
        function startTimerPolling() {
            stopTimerPolling();
            updateTimer();
            timerInterval = setInterval(updateTimer, 500);
        }

        function stopTimerPolling() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            hideTimer();
        }

        async function updateTimer() {
            const status = await callAPI('status');
            
            if (status.phase && status.phase !== 'idle' && status.phase !== 'results') {
                showTimer(status.phase, status.remainingTime);
                
                // Auto-transition when time expires
                if (status.timeExpired) {
                    handlePhaseTransition(status.phase);
                }
            } else {
                hideTimer();
            }
        }

        function showTimer(phase, remainingTime) {
            const timerDisplay = document.getElementById('timerDisplay');
            const phaseLabel = document.getElementById('phaseLabel');
            const timerValue = document.getElementById('timerValue');
            
            timerDisplay.classList.remove('hidden');
            
            // Phase names
            const phaseNames = {
                'wordReveal': 'WORD REVEAL',
                'hint': 'HINT PHASE',
                'discussion': 'DISCUSSION',
                'voting': 'VOTING TIME'
            };
            
            phaseLabel.textContent = phaseNames[phase] || phase.toUpperCase();
            
            // Format time
            const minutes = Math.floor(remainingTime / 60);
            const seconds = remainingTime % 60;
            timerValue.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Color based on time remaining
            const border = timerDisplay.parentElement.querySelector('#timerDisplay');
            if (remainingTime <= 5) {
                timerValue.className = 'text-3xl font-bold timer-urgent';
                border.className = 'bg-black/50 px-6 py-3 rounded-lg border-2 border-red-500';
            } else if (remainingTime <= 10) {
                timerValue.className = 'text-3xl font-bold timer-warning';
                border.className = 'bg-black/50 px-6 py-3 rounded-lg border-2 border-yellow-500';
            } else {
                timerValue.className = 'text-3xl font-bold timer-normal';
                border.className = 'bg-black/50 px-6 py-3 rounded-lg border-2 border-green-500';
            }
        }

        function hideTimer() {
            const timerDisplay = document.getElementById('timerDisplay');
            timerDisplay.classList.add('hidden');
        }

        async function handlePhaseTransition(currentPhase) {
            if (currentPhase === 'wordReveal') {
                // Auto-start hint phase
                const result = await callAPI('startHintPhase');
                if (result.success) {
                    gameState.currentPhase = result.phase;
                }
            } else if (currentPhase === 'hint') {
                // Skip to next player or discussion
                if (gameState.currentPlayer < gameState.players.length - 1) {
                    gameState.currentPlayer++;
                    gameState.wordRevealed = false;
                    render();
                    // Restart hint phase for next player
                    await callAPI('startHintPhase');
                } else {
                    await startDiscussionPhase();
                }
            } else if (currentPhase === 'discussion') {
                // Auto-start voting
                await startVotingPhase();
            } else if (currentPhase === 'voting') {
                // Auto-vote random if time expired
                const randomVote = Math.floor(Math.random() * gameState.players.length);
                await submitVote(randomVote);
            }
        }

        // UI Rendering
        function render() {
            const app = document.getElementById('app');
            
            if (gameState.screen === 'menu') {
                app.innerHTML = renderMenu();
            } else if (gameState.screen === 'hints') {
                app.innerHTML = renderHintScreen();
            } else if (gameState.screen === 'discussion') {
                renderDiscussionScreen();
            } else if (gameState.screen === 'voting') {
                renderVotingScreen();
            } else if (gameState.screen === 'results') {
                app.innerHTML = renderResults();
            }
        }

        function renderMenu() {
            return `
                <div class="max-w-6xl mx-auto">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Stats Card -->
                        <div class="bg-gradient-to-br from-purple-500/20 to-pink-500/20 backdrop-blur-lg rounded-2xl p-6 border border-purple-500/30 shadow-2xl">
                            <h3 class="text-xl font-bold mb-4 flex items-center">
                                <svg class="w-6 h-6 mr-2 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
                                </svg>
                                Statistics
                            </h3>
                            <div class="space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-gray-300">Total Games</span>
                                    <span class="text-2xl font-bold text-purple-400">${gameState.stats.totalGames}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-gray-300">Spy Wins</span>
                                    <span class="text-xl font-semibold text-red-400">${gameState.stats.spyWins}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-gray-300">Player Wins</span>
                                    <span class="text-xl font-semibold text-green-400">${gameState.stats.playerWins}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Game Setup -->
                        <div class="lg:col-span-2 bg-gradient-to-br from-blue-500/20 to-purple-500/20 backdrop-blur-lg rounded-2xl p-8 border border-blue-500/30 shadow-2xl">
                            <h2 class="text-3xl font-bold mb-6">🎮 Start New Game</h2>
                            
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm font-semibold mb-3 text-gray-300">
                                        Number of Players: <span id="playerCount">5</span>
                                    </label>
                                    <input type="range" id="numPlayers" min="4" max="8" value="5" 
                                           class="w-full h-3 bg-gray-700 rounded-lg appearance-none cursor-pointer"
                                           oninput="document.getElementById('playerCount').textContent = this.value">
                                </div>

                                <div>
                                    <label class="block text-sm font-semibold mb-3 text-gray-300">Choose Theme</label>
                                    <div class="grid grid-cols-2 gap-3">
                                        <button onclick="selectTheme('animals')" 
                                                class="theme-btn py-3 px-4 rounded-xl font-semibold transition-all bg-gray-700/50 hover:bg-gray-600/50"
                                                data-theme="animals">Animals</button>
                                        <button onclick="selectTheme('food')" 
                                                class="theme-btn py-3 px-4 rounded-xl font-semibold transition-all bg-gray-700/50 hover:bg-gray-600/50"
                                                data-theme="food">Food</button>
                                        <button onclick="selectTheme('places')" 
                                                class="theme-btn py-3 px-4 rounded-xl font-semibold transition-all bg-gray-700/50 hover:bg-gray-600/50"
                                                data-theme="places">Places</button>
                                        <button onclick="selectTheme('objects')" 
                                                class="theme-btn py-3 px-4 rounded-xl font-semibold transition-all bg-gray-700/50 hover:bg-gray-600/50"
                                                data-theme="objects">Objects</button>
                                    </div>
                                </div>

                                <div class="bg-yellow-500/20 border border-yellow-500/50 rounded-lg p-4">
                                    <p class="text-sm text-yellow-200 font-semibold mb-2">⏱️ Timed Game Mode:</p>
                                    <ul class="text-xs text-yellow-100 space-y-1">
                                        <li>• Word Reveal: 10 seconds</li>
                                        <li>• Hint Phase: 30 seconds per player</li>
                                        <li>• Discussion: 60 seconds</li>
                                        <li>• Voting: 20 seconds</li>
                                    </ul>
                                </div>

                                <button onclick="handleStartGame()" 
                                        class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-4 px-6 rounded-xl transition-all transform hover:scale-105 shadow-lg">
                                    Start Game
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        let selectedTheme = 'animals';
        
        function selectTheme(theme) {
            selectedTheme = theme;
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.dataset.theme === theme) {
                    btn.className = 'theme-btn py-3 px-4 rounded-xl font-semibold transition-all bg-gradient-to-r from-purple-500 to-pink-500';
                } else {
                    btn.className = 'theme-btn py-3 px-4 rounded-xl font-semibold transition-all bg-gray-700/50 hover:bg-gray-600/50';
                }
            });
        }

        function handleStartGame() {
            const numPlayers = parseInt(document.getElementById('numPlayers').value);
            startGame(numPlayers, selectedTheme);
        }

        function renderHintScreen() {
            const player = gameState.players[gameState.currentPlayer];
            
            return `
                <div class="max-w-2xl mx-auto">
                    <div class="bg-gradient-to-br from-purple-500/20 to-blue-500/20 backdrop-blur-lg rounded-2xl p-8 border border-purple-500/30 shadow-2xl">
                        <div class="text-center mb-8">
                            <div class="inline-block bg-purple-500/20 px-6 py-2 rounded-full mb-4">
                                <span class="text-sm font-semibold text-purple-300">
                                    Player ${gameState.currentPlayer + 1} of ${gameState.players.length}
                                </span>
                            </div>
                            <h2 class="text-3xl font-bold mb-2">${player.name}'s Turn</h2>
                            <p class="text-gray-400">Give a subtle hint about your word</p>
                        </div>

                        <button onclick="revealWord()" id="revealBtn"
                                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-6 px-6 rounded-xl transition-all transform hover:scale-105 shadow-lg">
                            👁️ Reveal Your Word (10s)
                        </button>

                        <div id="wordSection" class="hidden space-y-6 mt-6">
                            <div id="wordDisplay" class="p-8 rounded-xl text-center"></div>
                            
                            <div>
                                <label class="block text-sm font-semibold mb-2 text-gray-300">Enter Your Hint (30s)</label>
                                <input type="text" id="hintInput" placeholder="Be subtle and clever..."
                                       class="w-full bg-gray-800/50 border border-gray-600 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-purple-500">
                            </div>

                            <button onclick="handleSubmitHint()"
                                    class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-4 px-6 rounded-xl transition-all transform hover:scale-105 shadow-lg">
                                Submit Hint
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function revealWord() {
            const wordData = await getPlayerWord(gameState.currentPlayer);
            const wordSection = document.getElementById('wordSection');
            const wordDisplay = document.getElementById('wordDisplay');
            const revealBtn = document.getElementById('revealBtn');
            
            revealBtn.classList.add('hidden');
            wordSection.classList.remove('hidden');
            gameState.wordRevealed = true;
            
            // Start hint phase timer
            await callAPI('startHintPhase');
            
            if (wordData.isSpy) {
                wordDisplay.className = 'p-8 rounded-xl text-center bg-red-500/20 border-2 border-red-500';
                wordDisplay.innerHTML = `
                    <p class="text-sm font-semibold mb-2 text-gray-300">Your Word</p>
                    <p class="text-4xl font-bold mb-2">${wordData.word}</p>
                    <p class="text-red-400 font-semibold animate-pulse">⚠️ You are the SPY!</p>
                `;
            } else {
                wordDisplay.className = 'p-8 rounded-xl text-center bg-green-500/20 border-2 border-green-500';
                wordDisplay.innerHTML = `
                    <p class="text-sm font-semibold mb-2 text-gray-300">Your Word</p>
                    <p class="text-4xl font-bold">${wordData.word}</p>
                `;
            }
        }

        function handleSubmitHint() {
            const hint = document.getElementById('hintInput').value.trim();
            if (hint) {
                submitHint(gameState.currentPlayer, hint);
            } else {
                alert('Please enter a hint!');
            }
        }

        async function renderDiscussionScreen() {
            const hintsData = await callAPI('getHints');
            const app = document.getElementById('app');
            
            let hintsHTML = '';
            hintsData.hints.forEach((h, idx) => {
                hintsHTML += `
                    <div class="bg-gray-800/50 backdrop-blur rounded-xl p-6 border border-gray-700">
                        <h3 class="font-bold text-lg mb-3">${h.player}</h3>
                        <div class="bg-gray-900/50 rounded-lg p-4">
                            <p class="text-gray-300 italic">"${h.hint}"</p>
                        </div>
                    </div>
                `;
            });
            
            app.innerHTML = `
                <div class="max-w-4xl mx-auto">
                    <div class="bg-gradient-to-br from-blue-500/20 to-purple-500/20 backdrop-blur-lg rounded-2xl p-8 border border-blue-500/30 shadow-2xl">
                        <h2 class="text-3xl font-bold text-center mb-2">💬 Discussion Phase</h2>
                        <p class="text-center text-gray-400 mb-8">Review all hints and discuss who might be the spy (60 seconds)</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                            ${hintsHTML}
                        </div>
                        <button onclick="startVotingPhase()"
                                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-4 px-6 rounded-xl transition-all transform hover:scale-105 shadow-lg">
                            Proceed to Voting
                        </button>
                    </div>
                </div>
            `;
        }

        async function renderVotingScreen() {
            const hintsData = await callAPI('getHints');
            const app = document.getElementById('app');
            
            let hintsHTML = '';
            hintsData.hints.forEach((h, idx) => {
                hintsHTML += `
                    <div class="bg-gray-800/50 backdrop-blur rounded-xl p-6 border border-gray-700 hover:border-purple-500 transition-all">
                        <h3 class="font-bold text-lg mb-3">${h.player}</h3>
                        <div class="bg-gray-900/50 rounded-lg p-4 mb-4">
                            <p class="text-gray-300 italic">"${h.hint}"</p>
                        </div>
                        <button onclick="submitVote(${idx})"
                                class="w-full bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-700 hover:to-pink-700 text-white font-semibold py-3 px-4 rounded-lg transition-all transform hover:scale-105">
                            Vote for ${h.player}
                        </button>
                    </div>
                `;
            });
            
            app.innerHTML = `
                <div class="max-w-4xl mx-auto">
                    <div class="bg-gradient-to-br from-purple-500/20 to-pink-500/20 backdrop-blur-lg rounded-2xl p-8 border border-purple-500/30 shadow-2xl">
                        <h2 class="text-3xl font-bold text-center mb-2">🗳️ Vote for the Spy</h2>
                        <p class="text-center text-gray-400 mb-8">You have 20 seconds to vote!</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${hintsHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderResults() {
            const result = gameState.voteResult;
            const spyWon = result.spyWon;
            
            return `
                <div class="max-w-3xl mx-auto">
                    <div class="bg-gradient-to-br from-purple-500/20 to-blue-500/20 backdrop-blur-lg rounded-2xl p-8 border border-purple-500/30 shadow-2xl">
                        <div class="text-center mb-8">
                            <div class="inline-block px-8 py-4 rounded-2xl mb-6 ${spyWon ? 'bg-red-500/20 border-2 border-red-500' : 'bg-green-500/20 border-2 border-green-500'}">
                                <h2 class="text-4xl font-bold mb-2">
                                    ${spyWon ? '🕵️ SPY WINS!' : '🎉 PLAYERS WIN!'}
                                </h2>
                                <p class="text-gray-300">
                                    ${spyWon ? 'The spy avoided detection!' : 'The spy was caught!'}
                                </p>
                            </div>
                        </div>

                        <div class="bg-gray-800/50 rounded-xl p-6 border border-gray-700 mb-8">
                            <h3 class="font-semibold mb-3 text-purple-400">Game Details</h3>
                            <div class="space-y-2 text-sm">
                                <div class="flex justify-between">
                                    <span class="text-gray-400">The Spy Was:</span>
                                    <span class="font-bold text-red-400">${result.spyName}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-400">Player Word:</span>
                                    <span class="font-bold text-green-400">${result.normalWord}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-400">Spy Word:</span>
                                    <span class="font-bold text-red-400">${result.spyWord}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-400">Most Voted:</span>
                                    <span class="font-bold text-magenta-400">${result.mostVotedName}</span>
                                </div>
                            </div>
                        </div>

                        <button onclick="backToMenu()"
                                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-4 px-6 rounded-xl transition-all transform hover:scale-105 shadow-lg">
                            Return to Menu
                        </button>
                    </div>
                </div>
            `;
        }

        function backToMenu() {
            gameState.screen = 'menu';
            stopTimerPolling();
            render();
        }

        // Initialize
        updateStats();
        render();
    </script>
</body>
</html>
